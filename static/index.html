<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Chemical Industry ERP</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- PWA Manifest -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0B0F19">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fa-solid fa-flask-vial"></i>
            <h2>ChemERP</h2>
        </div>
        <nav class="nav-menu">
            <a href="#dashboard" class="nav-item active" data-target="dashboard">
                <i class="fa-solid fa-chart-pie"></i> <span>Dashboard</span>
            </a>
            <a href="#inventory" class="nav-item" data-target="inventory">
                <i class="fa-solid fa-boxes-stacked"></i> <span>Inventory</span>
            </a>
            <a href="#production" class="nav-item" data-target="production">
                <i class="fa-solid fa-industry"></i> <span>Production</span>
            </a>
            <a href="#lims" class="nav-item" data-target="lims">
                <i class="fa-solid fa-vial-virus"></i> <span>LIMS</span>
            </a>
            <a href="#qaqc" class="nav-item" data-target="qaqc">
                <i class="fa-solid fa-microscope"></i> <span>QA/QC</span>
            </a>
            <a href="#sales" class="nav-item" data-target="sales">
                <i class="fa-solid fa-briefcase"></i> <span>Sales & CRM</span>
            </a>
            <a href="#finance" class="nav-item" data-target="finance">
                <i class="fa-solid fa-file-invoice-dollar"></i> <span>Finance</span>
            </a>
        </nav>
        
        <div class="sidebar-footer">
            <button class="btn-sidebar-footer primary" id="aiCommandBtn">
                <i class="fa-solid fa-robot"></i> AI Command Center
            </button>
            <button class="btn-sidebar-footer" id="logoutBtn">
                <i class="fa-solid fa-power-off"></i> Logout
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <button class="menu-toggle" id="menuToggle">
            <i class="fa-solid fa-bars"></i>
        </button>

        <!-- Dynamic SPA Root -->
        <div id="app-root">
            <!-- Modules injected by app.js -->
        </div>
        
    </main>

    <script type="module" src="/static/js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful');
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
        
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('access_token');
            window.location.href = '/login';
        });
    </script>
</body>
</html>
