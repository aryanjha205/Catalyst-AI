<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ChemERP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #00e676; /* Parrot Green */
            --primary-dark: #00c853;
            --text-main: #111111;
            --text-muted: #666666;
            --border-color: #e0e0e0;
            --font-family: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* Left Panel */
        .left-panel {
            flex: 1;
            background-color: var(--primary-green);
            color: #ffffff;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        /* Subtle background circles for the left panel */
        .left-panel::before {
            content: '';
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            z-index: 0;
        }
        .left-panel::after {
            content: '';
            position: absolute;
            bottom: -10%;
            right: -5%;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            z-index: 0;
        }

        .left-content {
            position: relative;
            z-index: 1;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 80px;
        }

        .logo-icon {
            background-color: #ffffff;
            color: var(--primary-green);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .hero-text {
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -1.5px;
            max-width: 550px;
        }

        .privacy-box {
            background-color: rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            align-items: flex-start;
            gap: 15px;
            max-width: 400px;
            position: relative;
            z-index: 1;
        }

        .privacy-box i {
            font-size: 1.2rem;
            margin-top: 2px;
        }

        .privacy-text h4 {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .privacy-text p {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        /* Right Panel */
        .right-panel {
            width: 500px;
            background-color: #ffffff;
            padding: 60px 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
        }

        .form-header {
            margin-bottom: 35px;
        }

        .form-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .form-header p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .form-group input[type="email"],
        .form-group input[type="password"],
        .form-group input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: var(--font-family);
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-group input:focus {
            border-color: var(--primary-green);
        }

        .password-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .password-header a {
            font-size: 0.85rem;
            color: var(--primary-green);
            text-decoration: none;
            font-weight: 500;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .checkbox-group input {
            width: 16px;
            height: 16px;
            accent-color: var(--primary-green);
        }

        .checkbox-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
            cursor: pointer;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-green);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 30px 0;
            color: #aaa;
            font-size: 0.85rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .divider span {
            padding: 0 10px;
        }

        .btn-outline {
            width: 100%;
            padding: 12px;
            background-color: #ffffff;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }

        .btn-outline:hover {
            background-color: #f9f9f9;
            border-color: #ccc;
        }

        .footer-text {
            text-align: center;
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 20px;
        }

        @media (max-width: 900px) {
            .left-panel {
                display: none;
            }
            .right-panel {
                width: 100%;
                padding: 40px;
            }
        }
    </style>
</head>
<body>

    <!-- Left Panel -->
    <div class="left-panel">
        <div class="left-content">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fa-solid fa-flask"></i>
                </div>
                ChemERP
            </div>
            
            <h1 class="hero-text">
                Run every part of your business from one calm workspace.
            </h1>
        </div>

        <div class="privacy-box">
            <i class="fa-solid fa-shield-halved"></i>
            <div class="privacy-text">
                <h4>Private by design</h4>
                <p>Every workspace is securely isolated.</p>
            </div>
        </div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
        <div class="form-header">
            <h1>Welcome back</h1>
            <p>Use your workspace credentials to continue.</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email address</label>
                <input type="email" id="email" placeholder="you@company.com" required>
            </div>
            
            <div class="form-group">
                <div class="password-header">
                    <label>Password</label>
                    <a href="#">Show</a>
                </div>
                <input type="password" id="password" required>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="keepSignedIn" checked>
                <label for="keepSignedIn">Keep me signed in on this device</label>
            </div>

            <button type="submit" class="btn-primary">
                Sign in securely <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="divider">
            <span>New to ChemERP?</span>
        </div>

        <a href="/register" class="btn-outline">
            <i class="fa-regular fa-building"></i> Create a company workspace
        </a>

        <p class="footer-text">
            Employees should get a company code from their administrator.
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const formData = new URLSearchParams();
            formData.append('username', email);
            formData.append('password', password);

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('access_token', data.access_token);
                    window.location.href = '/';
                } else {
                    alert(data.detail || 'Invalid credentials');
                }
            } catch (error) {
                console.error(error);
                alert('Login failed');
            }
        });
    </script>
</body>
</html>
