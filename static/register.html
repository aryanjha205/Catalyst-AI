<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Registration - ChemERP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { justify-content: center; align-items: center; background-color: var(--sidebar-bg); padding: 20px;}
        .auth-container {
            background: var(--bg-color);
            padding: 40px;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            width: 100%;
            max-width: 600px;
        }
        .auth-container h2 { color: var(--secondary-color); margin-bottom: 20px; text-align: center; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group.full { grid-column: span 2; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; }
        .form-group input, .form-group textarea { 
            width: 100%; padding: 10px; border: 1px solid var(--border-color); 
            border-radius: 6px; font-family: var(--font-family);
        }
        .btn {
            background: var(--secondary-color); color: #fff; border: none;
            padding: 12px; width: 100%; border-radius: 6px; cursor: pointer;
            font-size: 1rem; font-weight: 600; transition: var(--transition);
        }
        .btn:hover { background: #55b800; }
        .auth-links { margin-top: 15px; font-size: 0.9rem; text-align: center; }
        .auth-links a { color: var(--primary-color); text-decoration: none; }
        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } .form-group.full { grid-column: span 1; } }
    </style>
</head>
<body>
    <div class="auth-container">
        <div style="text-align: center;">
            <i class="fa-solid fa-flask" style="color: var(--secondary-color); font-size: 3rem; margin-bottom: 10px;"></i>
        </div>
        <h2>Company Onboarding</h2>
        <form id="registerForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>Company Name</label>
                    <input type="text" id="company_name" required>
                </div>
                <div class="form-group">
                    <label>Owner Name</label>
                    <input type="text" id="owner_name" required>
                </div>
                <div class="form-group">
                    <label>Business Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="text" id="mobile" required>
                </div>
                <div class="form-group">
                    <label>GST Number</label>
                    <input type="text" id="gst_number" required>
                </div>
                <div class="form-group">
                    <label>PAN Number</label>
                    <input type="text" id="pan_number" required>
                </div>
                <div class="form-group">
                    <label>Business License</label>
                    <input type="text" id="license_number" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <div class="form-group full">
                    <label>Company Address</label>
                    <textarea id="address" rows="3" required></textarea>
                </div>
            </div>
            <button type="submit" class="btn">Register Company</button>
        </form>
        <div class="auth-links">
            <p>Already registered? <a href="/login">Login Here</a></p>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                company_name: document.getElementById('company_name').value,
                owner_name: document.getElementById('owner_name').value,
                email: document.getElementById('email').value,
                mobile: document.getElementById('mobile').value,
                gst_number: document.getElementById('gst_number').value,
                pan_number: document.getElementById('pan_number').value,
                license_number: document.getElementById('license_number').value,
                address: document.getElementById('address').value,
                password: document.getElementById('password').value,
            };

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (response.ok) {
                    alert('Registration Successful! Please login.');
                    window.location.href = '/login';
                } else {
                    const error = await response.json();
                    alert('Error: ' + error.detail);
                }
            } catch (error) {
                console.error(error);
                alert('Registration failed');
            }
        });
    </script>
</body>
</html>
